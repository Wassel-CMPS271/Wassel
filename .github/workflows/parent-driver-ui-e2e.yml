name: Parent and candidate driver UI E2E
on:
  push:
    branches: [feature/SCRUM-279-parent-live-map, feature/SCRUM-280-parent-notifications, develop]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: parent-driver-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parent-driver-ui-e2e:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wassel_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d wassel_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      # Immutable reviewed candidate, independent of later PR-head movement.
      # The runner still verifies its exact HEAD and tracked source cleanliness.
      - uses: actions/checkout@v4
        with:
          repository: Wassel-CMPS271/Wassel
          ref: 2cb70da8087b924eef8f920c84927c29535e6851
          path: tmp/parent-driver-candidate
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: tmp/parent-driver-candidate/frontend
      - run: npm run test:e2e:install -- --with-deps
        working-directory: frontend
      - name: Actual candidate driver UI to production Parent UI
        run: node e2e/review-parent-driver.mjs
        working-directory: frontend
        env:
          E2E_DRIVER_CHECKOUT: ${{ github.workspace }}/tmp/parent-driver-candidate
          E2E_DRIVER_EXPECTED_HEAD: 2cb70da8087b924eef8f920c84927c29535e6851
          E2E_MAVEN_CMD: mvn
          E2E_DB_URL: jdbc:postgresql://127.0.0.1:5432/wassel_e2e
          E2E_DB_USERNAME: postgres
          E2E_DB_PASSWORD: disposable-ci-only
      # No upload of authentication/mail logs, database files, traces or video.
