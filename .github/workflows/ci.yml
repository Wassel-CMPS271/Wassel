name: CI

on:
  push:
  pull_request:
    branches:
      - develop
      - main

# Cancel superseded runs on the same ref so a quick series of pushes doesn't queue up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The job ids below are the check names branch protection requires and the developer
# setup guide refers to (see "Continuous Integration" in the README). Renaming a job
# means updating the required checks too.
jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # verify = compile + unit/integration tests (surefire) + package. Any test failure fails the job.
      - name: Build and test with Maven
        run: mvn -B verify
        working-directory: backend
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      # No frontend test runner is set up yet; --if-present makes this a no-op until a
      # "test" script is added to frontend/package.json, after which it runs on every push.
      - name: Test
        run: npm test --if-present
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
