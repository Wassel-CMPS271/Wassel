name: CI

on:
  push:
  pull_request:
    # Retargeting an existing PR must verify its current integration base.
    types: [opened, synchronize, reopened, edited]
    branches:
      - develop
      - main

# Cancel superseded runs on the same ref so a quick series of pushes doesn't queue up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The job ids below are the check names branch protection requires and the developer
# setup guide refers to (see "Continuous Integration" in the README). Renaming a job
# means updating the required checks too.
jobs:
  auth-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wassel_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wassel_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:e2e:install -- --with-deps
        working-directory: frontend
      # All real-browser authentication, revocation and account-lockout cases.
      # No continue-on-error: compilation, migrations, seed or browser errors fail.
      - name: PostgreSQL authentication browser tests
        run: npm run test:e2e:auth
        working-directory: frontend
        env:
          E2E_MAVEN_CMD: mvn
          E2E_DB_URL: jdbc:postgresql://127.0.0.1:5432/wassel_e2e
          E2E_DB_USERNAME: postgres
          E2E_DB_PASSWORD: disposable-ci-only
      # Do not upload backend mail logs, database files, generated credentials,
      # traces or videos: they contain disposable authentication material.

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # verify = compile + unit/integration tests (surefire) + package. Any test failure fails the job.
      - name: Build and test with Maven
        run: mvn -B verify
        working-directory: backend
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
      # JaCoCo writes the HTML report during verify (SCRUM-151). A report only: nothing fails on a low number.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      # Known-vulnerability check (SCRUM-253). Fails the build on a high or critical finding in any npm
      # dependency, dev ones included. A new advisory can turn an unrelated PR red: fix it by updating the
      # package (or an override in package.json), not by removing this step.
      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      # Same run as `npm test` (a failing test still fails the job), plus a coverage report (SCRUM-151).
      - name: Test
        run: npm run test:coverage
        working-directory: frontend
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
      - name: Build
        run: npm run build
        working-directory: frontend

  routing-e2e:
    runs-on: ubuntu-latest
    # This job compiles the backend and builds the frontend itself. Run it
    # independently so an unrelated unit-test failure cannot hide its result.
    # backend-build/frontend-build remain required checks and still fail CI.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [success, failure-probe, cleanup-probe]
    env:
      E2E_DB_URL: jdbc:postgresql://127.0.0.1:5432/wassel_e2e
      E2E_DB_USERNAME: postgres
      E2E_MAVEN_CMD: mvn
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wassel_e2e
          POSTGRES_USER: postgres
          # Disposable GitHub-hosted job service, never a shared deployment.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wassel_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run real routing browser workflow against PostgreSQL
        if: matrix.scenario == 'success'
        run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_FAILURE_PROBE: ''
      - name: Confirm a broken Apply fails the browser workflow
        if: matrix.scenario == 'failure-probe'
        working-directory: frontend
        env:
          E2E_FAILURE_PROBE: apply
        run: |
          set +e
          npm run test:e2e > e2e-failure-probe.log 2>&1
          result=$?
          set -e
          cat e2e-failure-probe.log
          test "$result" -eq 1
          grep -F 'Apply and reload the committed optimizer order' e2e-failure-probe.log
          grep -F 'page.waitForResponse: Timeout' e2e-failure-probe.log
          grep -F 'E2E FAILED:' e2e-failure-probe.log
          node -e "const fs=require('node:fs'); const r=JSON.parse(fs.readFileSync('e2e-artifacts/results/.last-run.json')); if(r.status!=='failed'||r.failedTests.length!==1) process.exit(1)"
          test -n "$(find e2e-artifacts/results -name trace.zip -print -quit)"
          test -n "$(find e2e-artifacts/results -name 'test-failed-*.png' -print -quit)"
          test ! -f e2e-artifacts/credentials.json
      - name: Confirm unreleased assignments fail cleanup verification
        if: matrix.scenario == 'cleanup-probe'
        working-directory: frontend
        env:
          E2E_FAILURE_PROBE: cleanup
        run: |
          set +e
          npm run test:e2e > e2e-cleanup-probe.log 2>&1
          result=$?
          set -e
          cat e2e-cleanup-probe.log
          test "$result" -eq 1
          grep -F 'Cleanup must release every student routeId and stopPosition' e2e-cleanup-probe.log
          grep -F 'E2E FAILED:' e2e-cleanup-probe.log
          test ! -f e2e-artifacts/credentials.json
      - name: Upload browser report and isolated stack logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-e2e-diagnostics-${{ matrix.scenario }}
          retention-days: 7
          path: |
            frontend/e2e-artifacts/report/
            frontend/e2e-artifacts/results/
            frontend/e2e-artifacts/*.log
          if-no-files-found: warn
