name: CI

on:
  push:
  pull_request:
    branches:
      - develop
      - main

# Cancel superseded runs on the same ref so a quick series of pushes doesn't queue up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The job ids below are the check names branch protection requires and the developer
# setup guide refers to (see "Continuous Integration" in the README). Renaming a job
# means updating the required checks too.
jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # verify = compile + unit/integration tests (surefire) + package. Any test failure fails the job.
      - name: Build and test with Maven
        run: mvn -B verify
        working-directory: backend
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
      # JaCoCo writes the HTML report during verify (SCRUM-151). A report only: nothing fails on a low number.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      # Known-vulnerability check (SCRUM-253). Fails the build on a high or critical finding in any npm
      # dependency, dev ones included. A new advisory can turn an unrelated PR red: fix it by updating the
      # package (or an override in package.json), not by removing this step.
      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      # Same run as `npm test` (a failing test still fails the job), plus a coverage report (SCRUM-151).
      - name: Test
        run: npm run test:coverage
        working-directory: frontend
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
      - name: Build
        run: npm run build
        working-directory: frontend
