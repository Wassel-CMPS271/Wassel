name: Parent tracking E2E
on:
  push:
    branches: [feature/SCRUM-279-parent-live-map, develop]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: parent-tracking-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parent-tracking-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wassel_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wassel_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:e2e:install -- --with-deps
        working-directory: frontend
      # Real merged GPS API, production Parent map, stale boundary and authorization.
      # No continue-on-error: compilation, migrations, seed or browser errors fail.
      - name: PostgreSQL parent GPS browser test
        run: node e2e/review-parent-tracking.mjs
        working-directory: frontend
        env:
          E2E_MAVEN_CMD: mvn
          E2E_DB_URL: jdbc:postgresql://127.0.0.1:5432/wassel_e2e
          E2E_DB_USERNAME: postgres
          E2E_DB_PASSWORD: disposable-ci-only
      # Do not upload backend mail logs, database files, generated credentials,
      # traces or videos: they contain disposable authentication material.
