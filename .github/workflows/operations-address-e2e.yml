name: Independent address decisions and offline replay E2E
on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - 'frontend/src/**'
      - 'frontend/e2e/operations-*.e2e.ts'
      - 'frontend/e2e/run.mjs'
      - 'frontend/e2e/safe-summary-reporter*'
      - 'frontend/e2e/auth-helpers.ts'
      - 'frontend/playwright.config.ts'
      - 'frontend/package*.json'
      - 'docs/contracts/**'
      - '.github/workflows/operations-address-e2e.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]
    paths:
      - 'backend/**'
      - 'frontend/src/**'
      - 'frontend/e2e/operations-*.e2e.ts'
      - 'frontend/e2e/run.mjs'
      - 'frontend/e2e/safe-summary-reporter*'
      - 'frontend/e2e/auth-helpers.ts'
      - 'frontend/playwright.config.ts'
      - 'frontend/package*.json'
      - 'docs/contracts/**'
      - '.github/workflows/operations-address-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operations-address-${{ github.ref }}
  cancel-in-progress: true
jobs:
  operations-address-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wassel_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d wassel_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:e2e:install -- --with-deps
        working-directory: frontend
      - name: Real address decisions and offline confirmation replay
        run: npm run test:e2e -- --suite=operations
        working-directory: frontend
        env:
          E2E_MAVEN_CMD: mvn
          E2E_DB_URL: jdbc:postgresql://127.0.0.1:5432/wassel_e2e
          E2E_DB_USERNAME: postgres
          E2E_DB_PASSWORD: disposable-ci-only
      - name: Upload safe operations result and acceptance scope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-acceptance-evidence
          retention-days: 7
          path: |
            frontend/e2e-artifacts/operations-summary.json
            docs/testing/SCRUM-282/
          if-no-files-found: warn
      # Never upload credentials, auth/mail/backend logs, traces, screenshots or video.
