name: SCRUM-282 independent operations review
on:
  pull_request:
    branches: [develop]
    paths:
      - 'frontend/src/independent/operations/**'
      - 'frontend/src/test-support/operationsCandidate.ts'
      - 'frontend/src/app/(admin)/admin/operations-auth.independent.test.tsx'
      - '.github/workflows/operations-independent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operations-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Driver #144 and roster #142 are merged. Exercise accepted HEAD directly.
      - run: npm ci
        working-directory: frontend
      - name: Independent accepted-source acceptance
        run: npm test -- gps-queue.independent.test.ts gps-permission.independent.test.tsx roster.independent.test.tsx address-client.independent.test.ts operations-auth.independent.test.tsx --maxWorkers=2
        working-directory: frontend
      # No continue-on-error or expected-failure markers. Known product defects
      # remain red. The normal frontend-build also tests HEAD as integration gate.

  live-control-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Fetch immutable SCRUM-274 draft for independent review only
        run: git fetch origin ce1478449db1e86f2d2730d293834e6a6350c67f
      - run: npm ci
        working-directory: frontend
      - name: Independent active-run, freshness and reassignment acceptance
        run: npm test -- live-control.independent.test.tsx --maxWorkers=2
        working-directory: frontend
        env:
          WASSEL_CONTROL_CANDIDATE: ce1478449db1e86f2d2730d293834e6a6350c67f
      # Normal frontend-build also runs this file against HEAD. It remains red
      # until SCRUM-274 is accepted. Lateness requires its agreed server contract.
