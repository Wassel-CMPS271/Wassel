# Test profile (SCRUM-252): a real PostgreSQL in a Testcontainers container, with the real Flyway
# migrations and ddl-auto=validate, the same as production. The "tc" JDBC URL starts one container
# the first time it is used and every Spring test context in the run shares it, so the schema is
# migrated once. Docker must be running (CI's Ubuntu runners already have it); see backend/CLAUDE.md.
spring:
  datasource:
    url: jdbc:tc:postgresql:16:///wassel
    username: wassel
    password: wassel
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    # Every cached test context has its own pool, and the shared container has a connection limit. With Hikari's
    # default of 10 idle connections each, enough distinct contexts fail with "too many clients already"
    # (SCRUM-237). One idle connection each keeps the maximum of 10 for tests that really run in parallel.
    hikari:
      minimum-idle: 1

jwt:
  secret: test-secret-test-secret-test-secret-test-secret
  expiration: 1h
  cookie-secure: false

wassel:
  school:
    latitude: 33.896
    longitude: 35.484

# Tests expect straight-line times, so an ORS_API_KEY exported in the developer's shell must not reach them.
routing:
  openrouteservice:
    api-key: ""
