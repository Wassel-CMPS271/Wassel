# Test profile: in-memory H2 (PostgreSQL mode) so the build doesn't need a running database.
spring:
  datasource:
    url: jdbc:h2:mem:wassel;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  # Tests build the schema from the entities on H2; the migrations are PostgreSQL SQL.
  flyway:
    enabled: false

jwt:
  secret: test-secret-test-secret-test-secret-test-secret
  expiration: 1h
  cookie-secure: false

wassel:
  school:
    latitude: 33.896
    longitude: 35.484
