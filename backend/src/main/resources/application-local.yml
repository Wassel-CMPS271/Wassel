# Local development profile. Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wassel}
    username: ${DB_USERNAME:wassel}
    password: ${DB_PASSWORD:wassel}

  jpa:
    show-sql: true

  flyway:
    # A local database made before Flyway existed (by ddl-auto=update) already has the V1 schema:
    # adopt it as V1 instead of failing on a non-empty schema with no history table.
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:local-dev-secret-change-me-local-dev-secret-change-me}
  expiration: ${JWT_EXPIRATION:24h}
  cookie-secure: ${JWT_COOKIE_SECURE:false}

wassel:
  seed-admin:
    email: ${ADMIN_EMAIL:admin@wassel.local}
    password: ${ADMIN_PASSWORD:local-admin-password}
  demo:
    password: ${DEMO_PASSWORD:local-demo-password}
  # Verdun, Beirut — same coordinates as docs/contracts/samples/routing/route.json.
  school:
    latitude: ${SCHOOL_LATITUDE:33.896}
    longitude: ${SCHOOL_LONGITUDE:35.484}

logging:
  level:
    com.wassel.backend: DEBUG
    org.springframework.security: DEBUG
