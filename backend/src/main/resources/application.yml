spring:
  application:
    name: wassel-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # Only used by SmtpMailer, i.e. outside the local and test profiles. The username is read strictly
  # there (startup fails without it), but Boot binds a missing password leniently as the literal
  # "${MAIL_PASSWORD}", so docker-compose.staging.yml is what refuses to start without it.
  # Gmail wants an app password for the account, not its normal one.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      # Never send the password unencrypted.
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      # JavaMail waits forever by default. Sign-in and forgot-password send after their transaction has committed
      # (SCRUM-289), so a hung connection holds a request thread, not a database connection (admin invites still
      # send inside the transaction that creates the account). These are per network step, not per message: they
      # bound a hang, not the whole send.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  # The scheduled jobs (late alerts, location purge, notification email) would share Spring's default of one thread, so a
  # slow mail provider (each send can wait for its timeout) would hold up the late alerts. One thread per job.
  task:
    scheduling:
      pool:
        size: 3

  jpa:
    open-in-view: false
    hibernate:
      # Hibernate never changes the schema: Flyway does (db/migration), and Hibernate only checks
      # that the entities still match it, so a missing migration stops startup.
      ddl-auto: validate

# Health check for the host and uptime monitors (SCRUM-285). Only /actuator/health is exposed: no other actuator
# endpoint exists over HTTP, and the answer carries no details (no database name, disk sizes or versions), just UP
# or DOWN. It checks the database, so a lost connection answers 503.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    # The mail check opens an SMTP connection, which Railway blocks outside its Pro plan (and Brevo sends over
    # HTTPS, with no SMTP at all), so it would report DOWN for good. A failed send already fails the request
    # loudly (ERROR log, 500), so the health check keeps to what it can answer for: the app and its database.
    mail:
      enabled: false

jwt:
  # Must be overridden in every deployed environment.
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:1h}
  cookie-secure: ${JWT_COOKIE_SECURE:true}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

wassel:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  # How sign-in codes and links are emailed outside local and test: "smtp" (the spring.mail settings above,
  # the default) or "brevo" (Brevo's HTTPS API, for hosts that block outbound SMTP, such as Railway's
  # non-Pro plans). Brevo needs BREVO_API_KEY and BREVO_SENDER_EMAIL (an address verified in the Brevo
  # account); with "brevo", MAIL_USERNAME and MAIL_PASSWORD are not used.
  mail:
    provider: ${MAIL_PROVIDER:smtp}
    brevo:
      api-key: ${BREVO_API_KEY:}
      sender-email: ${BREVO_SENDER_EMAIL:}
      sender-name: ${BREVO_SENDER_NAME:Wassel}
  # Email for inbox entries (SCRUM-283, docs/contracts/notification-delivery.md): off unless NOTIFICATION_EMAIL_ENABLED=true.
  # It sends through the same mail provider as the sign-in codes, so the daily cap must stay well under that provider's
  # daily limit (Brevo's free plan is thought to be 300 a day, read the real figure off the account). Sign-in email has
  # its own cap below (wassel.auth.email); the two together must stay under that limit, minus a margin for invites,
  # which are never refused: NOTIFICATION_EMAIL_DAILY_CAP + AUTH_EMAIL_DAILY_CAP <= the limit (150 + 120 = 270 of 300).
  notifications:
    email:
      enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
      daily-cap: ${NOTIFICATION_EMAIL_DAILY_CAP:150}
  seed-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    school-id: ${SCHOOL_ID:00000000-0000-0000-0000-000000000001}
  # Demo data (SCRUM-200): off unless DEMO_DATA_ENABLED=true. It fills the seeded admin's school with a
  # head of transportation, a parent, vehicles, drivers and students, all signing in with DEMO_PASSWORD.
  # It skips itself when the database has accounts beyond the demo ones and the admin, unless
  # DEMO_DATA_FORCE=true.
  demo:
    enabled: ${DEMO_DATA_ENABLED:false}
    password: ${DEMO_PASSWORD:}
    force: ${DEMO_DATA_FORCE:false}
    # Accounts are demo+head@..., demo+parent@..., demo+driver-karim@... (a tag after the "+"). Sign-in
    # emails a code, so on a deployed environment set this to a real mailbox that supports "+" tags
    # (Gmail does) to receive the codes. The default only works where the code is logged (local).
    email-base: ${DEMO_EMAIL_BASE:demo@wassel.local}
  # Account lockout (SCRUM-171): this many wrong passwords in a row lock the account for this long. The lock
  # ends by itself; while it lasts, sign-in fails with the same error as a wrong password.
  auth:
    lockout:
      max-failures: ${LOCKOUT_MAX_FAILURES:5}
      duration: ${LOCKOUT_DURATION:15m}
    # The daily cap on sign-in, resend, reset and invite email (SCRUM-289, docs/contracts/auth-email.md). It shares the
    # provider's daily limit with the notification cap above: keep the two caps' sum under that limit, with a margin.
    email:
      daily-cap: ${AUTH_EMAIL_DAILY_CAP:120}
      reset-daily-cap: ${AUTH_EMAIL_RESET_DAILY_CAP:30}
      per-account-daily-cap: ${AUTH_EMAIL_PER_ACCOUNT_DAILY_CAP:10}
    # Per-address limit on the six public sign-in endpoints (SCRUM-288): this many POSTs from one address to one endpoint
    # in each window, then 429 with Retry-After. In memory, so it resets on a restart and assumes ONE backend instance.
    # trusted-proxy-hops is how many proxies in front of the backend each append to X-Forwarded-For; 0 ignores the
    # header (the connection's own address is used). Read the README ("Rate limit") before changing it on a host.
    # OFF unless RATE_LIMIT_ENABLED=true: with trusted-proxy-hops 0 everyone behind Railway shares one bucket, so turning
    # it on before the hop count is confirmed for the host could lock the whole school out of signing in.
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:false}
      window: ${RATE_LIMIT_WINDOW:1m}
      trusted-proxy-hops: ${RATE_LIMIT_TRUSTED_PROXY_HOPS:0}
      limits:
        login: ${RATE_LIMIT_LOGIN:30}
        two-factor-verify: ${RATE_LIMIT_2FA_VERIFY:60}
        two-factor-resend: ${RATE_LIMIT_2FA_RESEND:20}
        logout: ${RATE_LIMIT_LOGOUT:60}
        forgot-password: ${RATE_LIMIT_FORGOT_PASSWORD:10}
        set-password: ${RATE_LIMIT_SET_PASSWORD:30}
  # Must be overridden in every deployed environment: the MVP serves one school, and every
  # route response includes its location.
  school:
    latitude: ${SCHOOL_LATITUDE}
    longitude: ${SCHOOL_LONGITUDE}

geocoding:
  nominatim:
    base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
    # Nominatim's usage policy requires a descriptive User-Agent identifying the application.
    user-agent: ${NOMINATIM_USER_AGENT:Wassel-school-transport/1.0 (+https://github.com/Wassel-CMPS271/Wassel)}
    # The MVP serves one school in Lebanon. Without a country, "Verdun Street" resolves to Sydney. Blank turns it off.
    country-codes: ${NOMINATIM_COUNTRY_CODES:lb}
    # Connect and read timeout: a slow Nominatim must not hold the save (and its database connection) open.
    timeout: ${NOMINATIM_TIMEOUT:5s}

routing:
  openrouteservice:
    base-url: https://api.openrouteservice.org
    # Free key from openrouteservice.org. Blank = no road times: every matrix is straight-line (fine locally and
    # in CI). Sent in the Authorization header, never in a URL, so it cannot end up in an error message.
    api-key: ${ORS_API_KEY:}
    # Connect and read timeout: route responses wait on this while holding a database connection.
    timeout: 3s

# One JSON object per log line, with the severity in "log.level" (ECS). Loki (see
# docker-compose.staging.yml) parses these, so the level can be filtered on.
logging:
  structured:
    format:
      console: ecs
