# Staging environment mirroring production: builds and runs the real backend/frontend
# images (not dev servers, not the Spring `local` profile) against their own database.
# Credentials come from .env.staging (see .env.staging.example) — never reuse the
# local-dev defaults here.
# Usage: docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build
services:
  postgres:
    image: postgres:16
    container_name: wassel-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - wassel-staging-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: wassel-backend-staging
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: staging
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1h}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    container_name: wassel-frontend-staging
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

  # Central log store (SCRUM-143). Internal only: Grafana is the one way in.
  loki:
    image: grafana/loki:3.2.0
    container_name: wassel-loki-staging
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./ops/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - wassel-staging-loki:/loki

  # Collects every container's logs and sends them to Loki. Needs the Docker socket to find
  # containers, mounted read-only.
  promtail:
    image: grafana/promtail:3.2.0
    container_name: wassel-promtail-staging
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./ops/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  # Search and view the logs. Log in at http://localhost:3001 with the admin account set by
  # GRAFANA_ADMIN_PASSWORD in .env.staging.
  grafana:
    image: grafana/grafana:11.2.0
    container_name: wassel-grafana-staging
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env.staging}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - wassel-staging-grafana:/var/lib/grafana
    depends_on:
      - loki
    ports:
      - "3001:3000"

volumes:
  wassel-staging-pgdata:
  wassel-staging-loki:
  wassel-staging-grafana:
