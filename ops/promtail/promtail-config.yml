# Promtail ships every container's stdout/stderr to Loki. It discovers containers through
# the Docker socket (mounted read-only in docker-compose.staging.yml), so new services are
# picked up with no change here.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Label each line with its container name, e.g. wassel-backend-staging.
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      # And with its compose service name, e.g. backend. This is the label to query on.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
