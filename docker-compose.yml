# Local development database. Usage: docker compose up -d
# Credentials come from .env (see .env.example); defaults match application-local.yml.
services:
  postgres:
    image: postgres:16
    container_name: wassel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-wassel}
      POSTGRES_USER: ${DB_USERNAME:-wassel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wassel}
    ports:
      - "5432:5432"
    volumes:
      - wassel-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-wassel} -d ${DB_NAME:-wassel}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wassel-pgdata:
